<html lang="en">
<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20128%20128%22%3E%0A%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x2%3D%22.2%22%20y2%3D%221%22%3E%3Cstop%20stop-color%3D%22%2358766a%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23182930%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%0A%3Crect%20width%3D%22128%22%20height%3D%22128%22%20rx%3D%2229%22%20fill%3D%22%23202a2d%22%2F%3E%0A%3Cpath%20d%3D%22M21%20103V55q0-24%2023-31%2020-7%2040%200%2023%207%2023%2031v48z%22%20fill%3D%22%23bd8959%22%20stroke%3D%22%23f3c789%22%20stroke-width%3D%223%22%2F%3E%0A%3Cpath%20d%3D%22M28%2096V55q0-20%2019-25%2017-6%2034%200%2019%205%2019%2025v41z%22%20fill%3D%22url(%23g)%22%20stroke%3D%22%23653e3a%22%20stroke-width%3D%223%22%2F%3E%0A%3Cpath%20d%3D%22M43%2049V33l14%2010q7-2%2014%200l14-10v16q7%206%207%2014%200%2018-28%2025-28-7-28-25%200-8%207-14z%22%20fill%3D%22%23b3aaa0%22%20stroke%3D%22%23303541%22%20stroke-width%3D%223%22%2F%3E%0A%3Cpath%20d%3D%22M39%2058q14-8%2025%202%2011-10%2025-2-4%2017-17%2018l-8-5-8%205q-13-1-17-18z%22%20fill%3D%22%23393846%22%2F%3E%0A%3Cpath%20d%3D%22M52%2061h4m16%200h4%22%20stroke%3D%22%23fff0ca%22%20stroke-width%3D%223.5%22%20stroke-linecap%3D%22round%22%2F%3E%0A%3Cpath%20d%3D%22M59%2074q5%208%2010%200z%22%20fill%3D%22%233d3540%22%2F%3E%3Cpath%20d%3D%22M84%2084l4%207%207%204-7%204-4%207-4-7-7-4%207-4z%22%20fill%3D%22%23ffdf94%22%2F%3E%0A%3C%2Fsvg%3E%0A">
<style>
:root{color-scheme:dark;--ink:#f7ead4;--muted:#d2bea6;--gold:#e9bd76;--line:#ffffff25;font-family:system-ui,sans-serif;background:#10171b;color:var(--ink)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 26%,#323633,#171f24 53%,#10171b 88%);padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid #fff0a9;outline-offset:3px}
button:disabled{cursor:default}
.cabinet{width:min(100%,var(--host-width,728px),728px);display:grid;gap:10px}
.mast,.tools,.wordmark,.dialoghead,footer{display:flex;align-items:center}
.mast,.dialoghead,footer{justify-content:space-between}
.wordmark,.tools{gap:10px}
.emblem{width:39px;height:39px;display:grid;place-items:center;border:1px solid #e9bd7680;border-radius:50%;color:var(--gold);font-size:25px;box-shadow:inset 0 0 0 3px #151e22,inset 0 0 0 4px #e9bd7640}
.wordmark p,.eyebrow,footer,.roomtag{font-size:10px;font-weight:750;letter-spacing:.18em;margin:0;color:var(--gold)}
h1,h2{font-family:Georgia,'Times New Roman',serif;font-weight:normal;line-height:1;margin:3px 0 0}
h1{font-size:clamp(24px,5vw,37px)}
h2{font-size:clamp(25px,5.4vw,39px)}
.tool{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;background:#222b2d}
.tool:hover,.roomlist button:hover{background:#374042}
.tool svg{width:21px;height:21px}
.stage{position:relative;isolation:isolate;border-radius:18px;overflow:hidden;border:1px solid #d9a76569;box-shadow:0 19px 55px #0009,inset 0 0 0 1px #fff1;aspect-ratio:720/500;background:#25302c}
#art,#art>svg{display:block;width:100%;height:100%}
.roomtag,.steps,.hint{position:absolute;z-index:1}
.roomtag{left:13px;top:12px;display:flex;gap:7px;align-items:center;background:#16191de6;padding:7px 9px;border:1px solid #e0b97c54;border-radius:7px;letter-spacing:.09em}
#room-number{color:#e6b876} #room{color:#f6ead7}
.steps{right:12px;top:14px;display:flex;gap:5px;background:#16191de6;padding:8px;border-radius:8px;border:1px solid #e0b97c54}
.steps i{width:8px;height:8px;display:block;transform:rotate(45deg);border:1px solid #a99374}
.steps i[data-state=done]{background:#82dabb;border-color:#82dabb}
.steps i[data-state=current]{background:#ffcf83;border-color:#ffcf83}
.hint{left:50%;bottom:5%;transform:translateX(-50%);max-width:95%;white-space:nowrap;background:#17191de8;color:#fce5ac;font-size:clamp(11px,2.7vw,15px);font-weight:700;border:1px solid #f3d19065;border-radius:50px;padding:6px 12px}
.hint:empty{display:none}
.console{min-width:0;text-align:center;border:1px solid var(--line);background:linear-gradient(#272f30,#1c2527);padding:11px 12px 12px;border-radius:15px;min-height:143px}
.eyebrow{line-height:1.3}
.primary{margin:10px auto 0;min-height:46px;min-width:min(100%,200px);padding:8px 18px;border:1px solid #ffdfa7;border-radius:10px;background:linear-gradient(#ffe1a6,#d6a55d);color:#302619;font-size:15px;font-weight:800;box-shadow:0 4px #9f6a3a,0 8px 18px #0005}
.primary:active{transform:translateY(3px);box-shadow:0 1px #9f6a3a}
.choices{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:7px;margin:10px auto 0;max-width:570px}
.choices:empty{display:none}
.choice{min-width:0;min-height:65px;border:1px solid #b9956a79;border-radius:10px;background:linear-gradient(#464840,#2e3734);box-shadow:0 3px #131b1c;display:grid;place-items:center;gap:1px;padding:3px;color:#fff0d2}
.choice:not(:disabled):hover{background:#565347}
.choice:active{transform:translateY(2px)}
.choice svg{height:43px;width:52px;filter:drop-shadow(0 3px 3px #0008)}
.choice span{font-size:clamp(9px,2.25vw,13px);font-weight:650;line-height:1.1;overflow-wrap:anywhere}
.choice.wrong{border-color:#ff9d94;background:#57383c;color:#ffe2df}
.choice.right{border-color:#a9efd3;background:#315c50}
.watchbar{height:6px;max-width:235px;margin:17px auto 12px;background:#131c20;border-radius:6px;overflow:hidden}
.watchbar i{display:block;height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,#d29461,#ffdc9d)}
footer{padding:0 3px;font-size:9px;color:var(--muted);gap:7px}footer b{color:var(--gold);font-size:7px}
dialog{width:min(92%,450px);max-height:calc(100dvh - 24px);overflow:auto;color:var(--ink);padding:16px;border:1px solid #bb905d;border-radius:18px;background:#252e30;box-shadow:0 20px 85px #000b}
dialog::backdrop{background:#091014d9}
.dialoghead{margin-bottom:14px}
.roomlist{display:grid;gap:6px}
.roomlist button,.bonuses button{border:1px solid var(--line);background:#323b3a;border-radius:9px;min-height:44px}
.roomlist button{display:grid;grid-template-columns:2em 1fr auto;align-items:center;text-align:left;padding:5px 10px;gap:6px}
.roomlist button:disabled{opacity:.52}
.roomlist b{color:var(--gold);letter-spacing:.08em;white-space:nowrap;font-size:12px}
.roomlist span{font-size:14px}
.bonuses{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:13px}
.bonuses button{padding:4px 8px;margin:4px 4px 0 0}
.bonuses button[aria-pressed=true]{border-color:var(--gold)}
.bonuses p{margin:5px 0}
.effect{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.spark{position:absolute;left:var(--x);top:var(--y);width:5px;height:5px;background:#ffe2a0;box-shadow:0 0 7px #ffdc82;animation:spark .65s ease-out both}
@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%) rotate(45deg)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(160deg) scale(.35)}}
@media(max-width:420px){.mast,.tools{gap:6px}.wordmark{gap:7px}.emblem{width:32px;height:32px;font-size:21px}.wordmark p{font-size:8px}.cabinet{gap:8px}.console{padding-inline:7px}.roomtag{left:8px;top:8px;font-size:9px}.steps{right:8px;top:8px}.choice svg{height:38px}.choice span{font-size:10px}}
@media (orientation:portrait) and (max-width:600px){.stage{aspect-ratio:1.17}}
@media (orientation:landscape) and (max-height:570px){body{place-items:center}.cabinet{width:min(100%,var(--host-width,960px),960px);grid-template-columns:minmax(0,1.75fr) minmax(182px,1fr);grid-template-rows:auto 1fr auto;column-gap:11px}.mast{grid-column:1/-1}.stage{height:min(calc(100dvh - 92px),36vw);justify-self:center;max-width:100%}.console{align-self:center}.choices{grid-template-columns:repeat(2,minmax(0,1fr))}footer{grid-column:1/-1}.choice{min-height:49px}.choice svg{height:29px}.console h2{font-size:clamp(21px,4.1vw,30px)}}
@media (prefers-reduced-motion:reduce){.spark{display:none}}
</style>
</head>
<body>
<main class="cabinet" aria-label="Missing Exhibit">
  <header class="mast">
    <div class="wordmark"><span class="emblem" aria-hidden="true">✦</span><div><p>THE NIGHT MUSEUM</p><h1>Missing Exhibit</h1></div></div>
    <div class="tools">
      <button class="tool" id="sound" aria-label="Mute sound" title="Sound"></button>
      <button class="tool" id="map" aria-label="Open gallery map" title="Gallery map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m6-16v16M3 12h18"/></svg></button>
    </div>
  </header>
  <section class="stage" id="stage" aria-label="Museum display">
    <div id="art" aria-hidden="true"></div>
    <div class="roomtag"><span id="room-number"></span><span id="room"></span></div>
    <div class="steps" id="steps" aria-label="Case progress"></div>
    <div class="hint" id="status" aria-live="polite"></div>
    <div class="effect" id="effect" aria-hidden="true"></div>
  </section>
  <section class="console" aria-label="Game controls">
    <p class="eyebrow" id="phase-label"></p>
    <h2 id="objective"></h2>
    <div id="choices" class="choices"></div>
    <button class="primary" id="action"></button>
    <div class="watchbar" id="watchbar" aria-hidden="true"><i></i></div>
  </section>
  <footer><span>AFTER HOURS <b>◆</b> FIELD NOTES</span><span id="collection"></span></footer>
</main>
<dialog id="atlas" aria-labelledby="map-title">
  <div class="dialoghead"><div><p class="eyebrow">NIGHT MUSEUM</p><h2 id="map-title">Gallery map</h2></div><button class="tool" id="close-map" aria-label="Close gallery map">×</button></div>
  <div id="rooms" class="roomlist"></div>
  <div id="bonuses" class="bonuses" hidden></div>
</dialog>
<script>
(()=>{
'use strict';
const galleries = [
  {name:'The Curio Room', tone:'#35564f', glow:'#f6c98b', cloth:'#365b53', set:[0,1,2,3,4,5,6], count:3, watch:1750},
  {name:'The Coral Cabinet', tone:'#234e68', glow:'#8cdbcd', cloth:'#275765', set:[7,8,9,10,2,11,12], count:4, watch:1850},
  {name:'The Royal Archive', tone:'#643d58', glow:'#f1aa98', cloth:'#653751', set:[4,13,5,11,14,15,0], count:4, watch:1500},
  {name:'The Jade Gallery', tone:'#335b47', glow:'#e7de99', cloth:'#43583e', set:[16,17,12,3,18,9,10,6], count:5, watch:1850},
  {name:'The Observatory', tone:'#364364', glow:'#bccdf1', cloth:'#41446b', set:[19,1,18,15,8,14,13,7], count:5, watch:1550},
  {name:'The Grand Vault', tone:'#704440', glow:'#ffca86', cloth:'#693c44', set:[20,6,16,19,17,5,14,2,11], count:6, watch:1600}
];
const names = ['Ruby urn','Gold pocket watch','Ivory bust','Green perfume','Blue ribbon book','Sapphire crown','Pearl brooch','Coral shell','Blue globe','Jade seahorse','Glass jellyfish','Silver chalice','Amber fish','Rose locket','Gilded key','Bronze bell','Jade mask','Lucky cat','Crystal prism','Brass telescope','Royal Fabergé egg'];
const maximum = galleries.length - 1;
const storageKey = 'missing-exhibit-v1';
const clamp = (value,lo,hi) => Number.isInteger(value) ? Math.min(hi,Math.max(lo,value)) : lo;

function profile(raw={}) {
  const p = raw && typeof raw==='object' ? raw : {};
  const medals = Array.from({length:galleries.length},(_,i)=>clamp(p.medals?.[i],0,3));
  const unlocked = Math.max(0,...medals.map((medal,i)=>medal>0 ? Math.min(maximum,i+1) : 0));
  const rewards = {like:p.rewards?.like===true,comment:p.rewards?.comment===true};
  const coat = p.coat==='gold'&&rewards.like || p.coat==='silver'&&rewards.comment ? p.coat : 'classic';
  let visit = null;
  const v=p.visit;
  if (v && Number.isInteger(v.gallery) && v.gallery>=0 && v.gallery<=unlocked && Number.isInteger(v.seed)) {
    const step=clamp(v.step,0,2);
    const missed=v.missed===true;
    visit={gallery:v.gallery,seed:v.seed>>>0,step,score:clamp(v.score,0,step),missed,begun:v.begun===true||step>0||missed};
  }
  return {medals,unlocked,rewards,coat,mute:p.mute===true,visit};
}

function mergeProfiles(local,remote,allowVisit) {
  const other=profile(remote);
  return profile({...local,
    medals:local.medals.map((medal,i)=>Math.max(medal,other.medals[i])),
    rewards:{like:local.rewards.like||other.rewards.like,comment:local.rewards.comment||other.rewards.comment},
    visit:local.visit || (allowVisit ? other.visit : null)
  });
}

function shuffled(list,seed) {
  const result=[...list];
  for (let i=result.length-1;i>0;i--) {
    seed=(Math.imul(seed,1664525)+1013904223)>>>0;
    const j=Math.floor(seed/4294967296*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }
  return result;
}

function puzzle(visit) {
  const {gallery,seed,step}=visit;
  const room=galleries[gallery];
  const order=shuffled(room.set,seed ^ Math.imul(step+1,0x9e3779b1));
  const objects=order.slice(0,room.count);
  const slot=(seed+step*5+gallery*7)%objects.length;
  const missing=objects[slot];
  const wrong=order.slice(room.count,room.count+(gallery>1?2:1));
  const choices=shuffled([missing,...wrong,objects[(slot+1)%objects.length]],seed ^ Math.imul(step+3,0x85ebca6b));
  return {objects,slot,missing,choices,watch:room.watch+(step===0?130:-step*90)};
}

function answer(visit,id) {
  const board=puzzle(visit);
  if (!board.choices.includes(id)) return null;
  if (id!==board.missing) return {correct:false,visit:{...visit,missed:true}};
  const score=visit.score+(visit.missed?0:1);
  if (visit.step===2) return {correct:true,score,medal:Math.max(1,score),visit:null};
  return {correct:true,score,visit:{...visit,score,step:visit.step+1,missed:false}};
}

const jewel = (x,y,c,r=4) => `<path d="M${x} ${y-r}l${r} ${r}-${r} ${r}-${r}-${r}z" fill="${c}" stroke="#fff" stroke-opacity=".38" stroke-width=".65"/>`;
const rivet = (x,y) => `<circle cx="${x}" cy="${y}" r="2" fill="#dfb877"/><circle cx="${x-.5}" cy="${y-.6}" r=".6" fill="#fff0ae"/>`;
const loop = (x,y,r=6) => `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#efc574" stroke-width="2.5"/>`;

const objects = [
  ['#f8a38e','#9e3448','#471f37',`<path d="M38 17h24l-3 17c0 8 17 10 17 29 0 18-12 23-26 23S24 81 24 63c0-19 17-21 17-29z" fill="F"/><ellipse cx="50" cy="18" rx="14" ry="4" fill="#e98577"/><ellipse cx="50" cy="17" rx="10" ry="2" fill="#512338"/><path d="M27 58q23-10 46 0m-45 15q22 7 44 0M39 28h22" stroke="#f8c97e" fill="none" stroke-width="2.6"/>${jewel(50,65,'#ffdd93',8)}<path d="M36 44q-8 9-6 17" class="gleam"/>`],
  ['#ffe6a4','#d79543','#7f4530',`${loop(50,21,7)}<path d="M44 21h12v12H44z" fill="#ad7043"/><circle cx="50" cy="58" r="29" fill="F"/><circle cx="50" cy="57" r="23" fill="#fff0cc" stroke="#754632" stroke-width="1.5"/><path d="M50 39v4m0 28v5M31 57h5m28 0h5M50 57V45m0 12 10 6" stroke="#704735" stroke-width="2.3" stroke-linecap="round"/><circle cx="50" cy="57" r="2.6" fill="#ad6757"/><path d="M27 51q4-15 18-19" class="gleam"/>`],
  ['#fff1d3','#d4bba0','#897c7a',`<path d="M27 76h46l4 9H23zm5-11h36l4 11H28z" fill="F"/><path d="M50 24c16-1 20 12 17 23l-1 9-10 7v4H44l1-10-7-6c-4-9-3-24 12-27z" fill="F"/><path d="M36 48c-12-22 10-37 27-28 6 3 9 10 9 15-9-1-17-5-20-10-1 11-10 13-16 23z" fill="#e5d0aa"/><path d="M40 27q8-7 18-3m-10 18 4 1m8-2 4 1m-9 4 3 5-4 1m-1 6 6-1" stroke="#ad9584" fill="none" stroke-linecap="round" stroke-width="1.6"/>`],
  ['#a9e7ba','#459e7d','#216161',`<path d="M33 40l11-8V22h12v10l11 8 11 23-7 17-21 7-21-7-7-17z" fill="F"/><path d="m33 40 17 5 17-5m-17 5v42M22 63l28 5 28-5" stroke="#d2ffdc" stroke-opacity=".55" fill="none"/><rect x="40" y="14" width="20" height="15" rx="4" fill="#ebbb70"/><path d="M43 18v7m5-7v7m5-7v7m5-7v7" stroke="#a37550"/><path d="m36 46-7 15" class="gleam"/>${jewel(50,60,'#f5d18b',8)}`],
  ['#a0b6e1','#5373a7','#29375f',`<path d="m27 27 46-6 8 51-49 14-9-9z" fill="#263455"/><path d="m30 37 44-7 6 39-48 12-4-6z" fill="#e8d4ad"/><path d="m26 25 47-7 7 48-48 12-9-7z" fill="F"/><path d="m31 30 38-6 6 37-39 10z" fill="none" stroke="#dfbc84"/><path d="m60 19 6 48 1 16 5-7 6 4-5-16-7-46z" fill="#d98079"/>${jewel(49,47,'#f5d18b',9)}<path d="m26 30 5 37" class="gleam"/>`],
  ['#ffe1a0','#d59554','#8d4935',`<path d="m19 35 16 16 15-26 15 26 16-16-7 38H26z" fill="F"/><ellipse cx="50" cy="73" rx="24" ry="9" fill="#c47e54"/><ellipse cx="50" cy="69" rx="24" ry="6" fill="#f6c681"/><path d="M25 58q25 9 50 0" fill="none" stroke="#ffe7b1" stroke-width="2"/>${jewel(50,52,'#648fdf',9)}${jewel(34,59,'#79bfba',4)}${jewel(66,59,'#c45e88',4)}<circle cx="19" cy="33" r="4" fill="#ffd791"/><circle cx="50" cy="24" r="5" fill="#ffeab5"/><circle cx="81" cy="33" r="4" fill="#ffd791"/>`],
  ['#fff5d8','#deb18f','#987175',`<path d="M50 21 77 34l5 24-15 21H33L18 58l5-24z" fill="#bd8758"/><path d="M50 26 73 37l4 20-13 17H36L23 57l4-20z" fill="none" stroke="#ffdd96" stroke-width="3"/><circle cx="50" cy="52" r="17" fill="F"/>${[[50,29],[67,37],[74,53],[64,69],[50,73],[35,68],[26,53],[34,37]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4" fill="#fff0d8"/>`).join('')}<path d="M40 49q3-7 10-8" class="gleam"/>`],

 }
 function reward(kind,e){if(!alive||!e||typeof e!=='object'||typeof e.project_id!=='string'||!e.project_id.trim()||kind==='like'&&e.status!==true||kind==='comment'&&typeof e.content!=='string')return;let p=read();if(p.rewards?.[kind])return;p.rewards={...p.rewards,[kind]:true};write(p,false);emit({type:'reward',kind});save();}

   try{Promise.resolve(sdk.loadUserGameState()).then(raw=>{if(!alive||gen!==epoch||resolved)return;resolved=true;if(recognized(raw)){write(raw.profile,true);emit({type:'cloud'});}cloudReady=recognized(raw)||!!raw&&typeof raw==='object'&&!Array.isArray(raw)&&Object.keys(raw).length===0;if(dirty)flush();},()=>{if(gen===epoch){resolved=true;cloudReady=false;}});}catch{resolved=true;cloudReady=false;}}
  notifyStart();reg('like','onLike');reg('comment','onComment');if(dirty)flush();
 }
 function probe(n=0){connect();if(alive&&n<8)later(()=>probe(n+1),1500);}
 function nudge(){connect();}const external=typeof globalThis.addEventListener==='function';if(external)for(let name of ['pointerdown','focus','resize'])globalThis.addEventListener(name,nudge,{passive:true});probe();
 return{save,connect,support:()=>({...support}),prepare(){started=false;ended=false;startHost=null;},start(){connect();if(started&&!ended){notifyStart();return;}started=true;ended=false;notifyStart();},end(){if(!started||ended)return;ended=true;let destination=startHost;if(destination)call(destination,'gameOver');},
  viewport(){let h=getHost();try{let v=h?.getGameViewport?.();if(v&&typeof v.then==='function'){Promise.resolve(v).catch(()=>{});return null;}if(v&&Number.isFinite(v.width)&&Number.isFinite(v.height)&&v.width>0&&v.height>0)return{width:v.width,height:v.height,density:Number.isFinite(v.density)&&v.density>0?v.density:1};}catch{}return null;},
  stop(){if(!alive)return;alive=false;epoch++;if(external)for(let name of ['pointerdown','focus','resize'])globalThis.removeEventListener(name,nudge);for(let t of timers)cancel(t);timers.clear();for(let e of entries.values()){e.expired=true;safeStop(e.stop);}entries.clear();support={like:false,comment:false};}

const $=id=>document.getElementById(id);
const state={phase:'ready',elapsed:0,last:0,selection:null,receipt:null};
const load=()=>{
  try { return profile(JSON.parse(localStorage.getItem(storageKey))); }
  catch { return profile(); }
};
let data=load();
let visit=data.visit || newVisit(0);
let board=puzzle(visit);
let hostBridge;
let interacted=false;
let support={like:false,comment:false};
let audio;
let voices=new Set();
let particleTimer=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

function newVisit(gallery) {
  const seed=new Uint32Array(1);
  if (globalThis.crypto?.getRandomValues) crypto.getRandomValues(seed);
  else seed[0]=Math.floor(Math.random()*4294967296);
  return {gallery,seed:seed[0],step:0,score:0,missed:false,begun:false};
}

function store() {
  try { localStorage.setItem(storageKey,JSON.stringify(data)); }
  catch { /* Session play remains available. */ }
}

function commit() {
  store();
  hostBridge?.save();
}

function syncProfile(incoming,remote) {
  const mayRestore=!interacted && !data.visit && state.phase==='ready';
  data=remote ? mergeProfiles(data,incoming,mayRestore) : profile(incoming);
  if (mayRestore && data.visit) {
    visit=data.visit;
    board=puzzle(visit);
    paint();
    render();
  }
  store();
  renderMeta();
  if ($('atlas').open) renderMap();
}

function restartBridge() {
  hostBridge=bridge({
    read:()=>profile(data),
    write:syncProfile,
    changed:event=>{
      if (event.type==='support') support={like:event.like,comment:event.comment};
      if (event.type==='connected') {
        support={like:false,comment:false};
        requestAnimationFrame(applyViewport);
      }
      if ($('atlas').open) renderMap();
      if (event.type==='reward') playCue('clear');
    }
  });
}

function unlockAudio() {
  if (data.mute) return;
  try {
    const Audio=window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    audio ||= new Audio();
    audio.resume().catch(()=>{});
  } catch { /* Sound is optional. */ }
}

function playCue(kind) {
  if (!audio || audio.state!=='running' || data.mute || document.hidden) return;
  const cues={
    start:[[392,0,.13],[523,.09,.14]],
    steal:[[195,0,.16],[122,.10,.16],[740,.30,.09]],
    miss:[[233,0,.12],[175,.10,.17]],
    found:[[523,0,.14],[659,.06,.15],[784,.12,.21]],
    clear:[[523,0,.17],[659,.09,.17],[784,.18,.22],[1047,.27,.34]]
  };
  for (const [hz,delay,length] of cues[kind]) {
    if (voices.size>=18) break;
    const osc=audio.createOscillator();
    const gain=audio.createGain();
    const t=audio.currentTime+delay;
    osc.type=kind==='steal'?'triangle':'sine';
    osc.frequency.setValueAtTime(hz,t);
    if (kind==='steal') osc.frequency.exponentialRampToValueAtTime(hz*.67,t+length);
    gain.gain.setValueAtTime(.0001,t);
    gain.gain.exponentialRampToValueAtTime(.09,t+.017);
    gain.gain.exponentialRampToValueAtTime(.0001,t+length);
    osc.connect(gain).connect(audio.destination);
    voices.add(osc);
    osc.onended=()=>{voices.delete(osc);osc.disconnect();gain.disconnect();};
    osc.start(t);
    osc.stop(t+length+.01);
  }
}

function hush() {
  for (const osc of voices) {
    try { osc.stop(); }
    catch { /* A voice may already have ended. */ }
  }
  voices.clear();
}

function renderMeta() {
  $('sound').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10v4h4l5 4V6l-5 4H3z"/>'+(data.mute?'<path d="m16 10 5 5m0-5-5 5"/>':'<path d="M16 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/>')+'</svg>';
  $('sound').setAttribute('aria-label',data.mute?'Unmute sound':'Mute sound');
  $('sound').setAttribute('aria-pressed',String(data.mute));
  $('collection').textContent=`${data.medals.reduce((a,b)=>a+b,0)} / 18 STARS`;
}

function paint() {
  $('art').innerHTML=stageArt(galleries[visit.gallery],board,data.coat);
  draw();
}

function draw() {
  const phase=state.phase;
  const sneak=phase==='sneak';
  const t=sneak?Math.min(1,state.elapsed/820):0;
  const spot=artPosition(board.objects.length,board.slot);
  const hidden=phase==='choose'||phase==='wrong'||(sneak&&t>.54);
  const trophy=document.querySelector(`[data-slot="${board.slot}"]`);
  const ring=document.querySelector(`[data-ring="${board.slot}"]`);
  const cat=$('prowler');
  if (!cat || !trophy || !ring) return;
  trophy.setAttribute('opacity',hidden?'0':'1');
  ring.setAttribute('opacity',phase==='choose'||phase==='wrong'?'1':'0');
  const dark=sneak ? Math.sin(t*Math.PI)**.65*.90 : 0;
  $('shade').setAttribute('opacity',dark);
  const solved=phase==='found'||phase==='receipt';
  const cameo=phase==='ready';
  const catX=cameo?590:sneak ? 74+572*t:600;
  const catY=cameo?372:sneak ? 345-Math.sin(t*Math.PI)*21:373;
  const bounce=solved && !reduced ? -Math.max(0,Math.sin(Math.min(1,state.elapsed/650)*Math.PI))*17:0;
  cat.setAttribute('transform',`translate(${catX} ${catY+bounce}) scale(${cameo?'.72':'.85'})`);
  cat.setAttribute('opacity',sneak ? Math.sin(t*Math.PI)*.93 : solved?'1':cameo?'.92':'0');
  const sw=$('swipe');
  sw.setAttribute('transform',`translate(${spot.x} ${spot.y})`);
  sw.setAttribute('opacity',sneak&&t>.43&&t<.65&&(visit.gallery===0&&visit.step===0) ? '.84' : '0');
  if (phase==='watch') $('watchbar').firstElementChild.style.transform=`scaleX(${Math.max(0,1-state.elapsed/board.watch)})`;
}

function phase(next) {
  state.phase=next;
  state.elapsed=0;
  render();
  draw();
}

function render() {
  const current=state.phase;
  const row=galleries[visit.gallery];
  $('room-number').textContent=String(visit.gallery+1).padStart(2,'0');
  $('room').textContent=row.name;
  const completed=current==='found'||current==='receipt'?visit.step+1:visit.step;
  $('steps').setAttribute('aria-label',`${completed} of 3 exhibits recovered`);
  $('steps').innerHTML=Array.from({length:3},(_,i)=>`<i data-state="${i<completed?'done':i===completed?'current':'next'}"></i>`).join('');
  const messages={
    ready:['THE MUSEUM IS CLOSING','Spot the missing treasure.',visit.begun?'Resume case':'Start case','One exhibit will disappear'],
    watch:['LIGHTS ON','Remember these treasures.',null,'Look at the display'],
    sneak:['LIGHTS OUT','Something moved…',null,''],
    choose:[`EXHIBIT ${visit.step+1} OF 3`,'What went missing?',null,'Find the treasure from the empty stand'],
    wrong:['TAKE ANOTHER LOOK','Try another treasure.',null,'That one is still accounted for'],
    found:['TREASURE RECOVERED','Back in its place!',null,state.receipt?.first?'First try!':'Safe and sound'],
    receipt:['CASE CLOSED',`${state.receipt?.medal} ${state.receipt?.medal===1?'star':'stars'} earned`,visit.gallery<maximum?'Next gallery':'Play again','All three treasures recovered']
  };
  const [label,objective,action,hint]=messages[current];
  $('phase-label').textContent=label;
  $('objective').textContent=objective;
  $('status').textContent=hint;
  $('action').hidden=!action;
  $('action').textContent=action||'';
  $('watchbar').hidden=current!=='watch'&&current!=='sneak';
  if (current==='sneak') $('watchbar').firstElementChild.style.transform='scaleX(0)';
  const show=current==='choose'||current==='wrong'||current==='found';
  $('choices').style.setProperty('--n',board.choices.length);
  $('choices').innerHTML=show?board.choices.map(id=>{
    const selected=id===state.selection;
    const result=current==='found'&&selected?'right':current==='wrong'&&selected?'wrong':'';
    return `<button type="button" class="choice ${result}" data-choice="${id}" ${current==='found'?'disabled':''}>${cardArt(id)}<span>${names[id]}</span></button>`;
  }).join(''):'';
  renderMeta();
}

function spark() {
  if (reduced) return;
  const pos=artPosition(board.objects.length,board.slot);
  const size=$('art').getBoundingClientRect();
  const scale=Math.max(size.width/720,size.height/500);
  const x=(pos.x-360)*scale+size.width/2;
  const y=(pos.y-250)*scale+size.height/2;
  $('effect').innerHTML=Array.from({length:20},(_,i)=>{
    const a=i*2.39996;
    const r=21+(i%5)*10;
    return `<i class="spark" style="--x:${x}px;--y:${y}px;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px"></i>`;
  }).join('');
  clearTimeout(particleTimer);
  particleTimer=setTimeout(()=>$('effect').replaceChildren(),740);
}

function begin() {
  interacted=true;
  unlockAudio();
  hostBridge?.start();
  visit={...visit,begun:true};
  data.visit=visit;
  commit();
  state.selection=null;
  phase('watch');
  playCue('start');
}

function choose(id) {
  if (!['choose','wrong'].includes(state.phase)||$('atlas').open||document.hidden) return;
  const result=answer(visit,id);
  if (!result) return;
  unlockAudio();
  state.selection=id;
  if (!result.correct) {
    visit=result.visit;
    data.visit=visit;
    commit();
    phase('wrong');
    $('choices').querySelector(`[data-choice="${id}"]`)?.focus({preventScroll:true});
    playCue('miss');
    return;
  }
  const first=!visit.missed;
  data.visit=result.visit;
  if (!result.visit) {
    data.medals[visit.gallery]=Math.max(data.medals[visit.gallery],result.medal);
    data=profile(data);
    hostBridge?.end();
  }
  state.receipt={...result,first};
  commit();
  phase('found');
  playCue(result.visit?'found':'clear');
  spark();
}

function next() {
  if (state.phase==='ready') return begin();
  if (state.phase==='receipt') pickGallery(visit.gallery<maximum?visit.gallery+1:visit.gallery);
}

function tick(now) {
  const delta=Math.min(55,Math.max(0,now-(state.last||now)));
  state.last=now;
  if (!document.hidden && !$('atlas').open) {
    state.elapsed+=delta;
    if (state.phase==='watch'&&state.elapsed>=board.watch) {
      phase('sneak');
      playCue('steal');
    } else if (state.phase==='sneak'&&state.elapsed>=820) {
      phase('choose');
    } else if (state.phase==='found'&&state.elapsed>=860) {
      if (!state.receipt.visit) phase('receipt');
      else {
        visit=state.receipt.visit;
        board=puzzle(visit);
        state.selection=null;
        state.phase='watch';
        state.elapsed=0;
        paint();
        render();
        playCue('start');
      }
    } else if (['watch','sneak','found'].includes(state.phase)) draw();
  }
  requestAnimationFrame(tick);
}

function pickGallery(index) {
  if (index>data.unlocked) return;
  if (data.visit && data.visit.gallery===index) {
    $('atlas').close();
    return;
  }
  interacted=true;
  hostBridge?.end();
  hostBridge?.prepare();
  visit=newVisit(index);
  board=puzzle(visit);
  data.visit=visit;
  state.selection=null;
  state.receipt=null;
  state.phase='ready';
  state.elapsed=0;
  commit();
  $('atlas').close();
  paint();
  render();
}

function renderMap() {
  $('rooms').innerHTML=galleries.map((room,i)=>`<button data-gallery="${i}" ${i>data.unlocked?'disabled':''}><b>${String(i+1).padStart(2,'0')}</b><span>${room.name}</span><b aria-label="${i>data.unlocked?'Locked':`${data.medals[i]} stars`}">${i>data.unlocked?'LOCKED':'★'.repeat(data.medals[i])+'☆'.repeat(3-data.medals[i])}</b></button>`).join('');
  const active=data.rewards.like||data.rewards.comment||support.like||support.comment;
  $('bonuses').hidden=!active;
  $('bonuses').innerHTML=active?[
    '<p class="eyebrow">THE PROWLER’S COATS</p>',
    support.like&&!data.rewards.like?'<p>Like the game in GameWave to earn the amber coat.</p>':'',
    support.comment&&!data.rewards.comment?'<p>Leave a direct comment in GameWave to earn the silver coat.</p>':'',
    data.rewards.like||data.rewards.comment?'<p>Coats change the raccoon in every gallery.</p>':'',
    ...[['classic','Classic'],['gold','Amber'],['silver','Silver']].filter(([id])=>id==='classic'||(id==='gold'?data.rewards.like:data.rewards.comment)).map(([id,label])=>`<button data-coat="${id}" aria-pressed="${data.coat===id}">${label}</button>`)
  ].join(''):'';
}

function applyViewport() {
  const v=hostBridge?.viewport();
  const root=document.documentElement;
  if (!v) return root.style.removeProperty('--host-width');
  const safeWidth=Math.min(v.width,document.documentElement.clientWidth);
  if (safeWidth>=280) root.style.setProperty('--host-width',`${safeWidth}px`);
  else root.style.removeProperty('--host-width');
}

$('action').addEventListener('click',next);
$('choices').addEventListener('click',e=>{
  const button=e.target.closest('[data-choice]');
  if (button) choose(Number(button.dataset.choice));
});
$('sound').addEventListener('click',()=>{
  data.mute=!data.mute;
  if (data.mute) hush();
  else unlockAudio();
  commit();
  renderMeta();
});
$('map').addEventListener('click',()=>{
  hush();
  renderMap();
  $('atlas').showModal();
});
$('close-map').addEventListener('click',()=>$('atlas').close());
$('rooms').addEventListener('click',e=>{
  const button=e.target.closest('[data-gallery]');
  if (button) pickGallery(Number(button.dataset.gallery));
});
$('bonuses').addEventListener('click',e=>{
  const button=e.target.closest('[data-coat]');
  if (!button) return;
  data=profile({...data,coat:button.dataset.coat});
  paint();
  commit();
  renderMap();
});
document.addEventListener('keydown',e=>{
  if ($('atlas').open||e.repeat||e.ctrlKey||e.altKey||e.metaKey) return;
  if (/^[1-4]$/.test(e.key)) {
    const id=board.choices[Number(e.key)-1];
    if (id!==undefined) choose(id);
  }
});
document.addEventListener('visibilitychange',()=>{
  state.last=0;
  if (document.hidden) hush();
  else hostBridge?.connect();
});
window.addEventListener('resize',applyViewport);
window.addEventListener('pagehide',()=>{
  hostBridge?.stop();
  hostBridge=null;
  hush();
});
window.addEventListener('pageshow',e=>{
  if (!e.persisted) return;
  data=load();
  visit=data.visit||newVisit(visit.gallery<=data.unlocked?visit.gallery:0);
  board=puzzle(visit);
  state.receipt=null;
  state.selection=null;
  state.phase='ready';
  state.elapsed=0;
  state.last=0;
  restartBridge();
  applyViewport();
  paint();
  render();
});

paint();
render();
restartBridge();
applyViewport();
requestAnimationFrame(tick);

})();
</script>
